name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-rl.txt
            requirements-kaggle.txt
            pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Run scenario smoke test
        run: |
          mkdir -p ci_smoke
          python main.py --results-root ci_smoke --include fixed_30 --max-scenarios 1 --stop-on-error
      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: ci_smoke

  docs-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
      - name: Check links
        uses: lycheeverse/lychee-action@v1
        with:
          args: --config .lychee.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-test:
    runs-on: ubuntu-latest
    needs:
      - smoke
      - docs-quality
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-kaggle.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest ruff
      - name: Path hygiene check
        run: |
          if rg -n "configs/" -tpy src; then
            echo "Path hygiene failed: plain configs/ literals in src"
            exit 1
          else
            echo "Path hygiene passed"
          fi
      - name: Verify dependency health
        run: |
          pip check || true
      - name: Lint (ruff)
        run: |
          ruff check .
      - name: Run tests
        run: |
          pytest -q

  build-package:
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build
      - name: Install wheel and run CLI smoke
        run: |
          set -euo pipefail
          pip install dist/*.whl
          mkdir -p ci_cli_json
          leadlag --status --format json > ci_cli_json/status.json
          python scripts/validate_cli_payload.py ci_cli_json/status.json
          LEADLAG_RESULTS_ROOT=/tmp/leadlag-ci-results leadlag-full-suite --format json --dry-run > ci_cli_json/full_suite.json
          python scripts/validate_cli_payload.py ci_cli_json/full_suite.json
          leadlag-ablation --format json --dry-run --output-root /tmp/leadlag-ci-ablation --skip-missing-deps > ci_cli_json/ablation.json
          python scripts/validate_cli_payload.py ci_cli_json/ablation.json
          python -c "from leadlag.hydra_main import get_available_scenarios; print(f'available_scenarios={len(get_available_scenarios())}')"
      - name: Upload CLI smoke payloads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-json-smoke
          path: ci_cli_json

  extras-tests:
    runs-on: ubuntu-latest
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: signature
            extras: signature
          - label: rl
            extras: rl
          - label: all
            extras: 'rl,signature'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install package with extras
        run: |
          python -m pip install --upgrade pip
          pip install .[${{ matrix.extras }}]
      - name: Run targeted tests
        run: |
          if [ "${{ matrix.extras }}" = "signature" ]; then
            pytest tests/test_signature.py tests/test_signature_pipeline.py
          elif [ "${{ matrix.extras }}" = "rl" ]; then
            pytest tests/test_policy_factory.py
          else
            pytest -m 'not kaggle'
          fi
