name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-rl.txt
            requirements-kaggle.txt
            pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Run scenario smoke test
        run: |
          mkdir -p ci_smoke
          python main.py --results-root ci_smoke --include fixed_30 --max-scenarios 1 --stop-on-error
      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: ci_smoke

  docs-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
      - name: Check links
        uses: lycheeverse/lychee-action@v1
        with:
          args: --config .lychee.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-test:
    runs-on: ubuntu-latest
    needs:
      - smoke
      - docs-quality
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-kaggle.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest ruff
      - name: Path hygiene check
        run: |
          if rg -n "configs/" -tpy src; then
            echo "Path hygiene failed: plain configs/ literals in src"
            exit 1
          else
            echo "Path hygiene passed"
          fi
      - name: Verify dependency health
        run: |
          pip check || true
      - name: Lint (ruff)
        run: |
          ruff check .
      - name: Run tests
        run: |
          pytest -q

  build-package:
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build
      - name: Install wheel and run CLI smoke
        run: |
          set -euo pipefail
          pip install dist/*.whl
          mkdir -p ci_cli_json
          leadlag --status --format json > ci_cli_json/status.json
          python scripts/validate_cli_payload.py ci_cli_json/status.json
          LEADLAG_RESULTS_ROOT=/tmp/leadlag-ci-results leadlag-full-suite --format json --dry-run > ci_cli_json/full_suite.json
          python scripts/validate_cli_payload.py ci_cli_json/full_suite.json
          leadlag-ablation --format json --dry-run --output-root /tmp/leadlag-ci-ablation --skip-missing-deps > ci_cli_json/ablation.json
          python scripts/validate_cli_payload.py ci_cli_json/ablation.json
          python -c "from leadlag.hydra_main import get_available_scenarios; print(f'available_scenarios={len(get_available_scenarios())}')"
      - name: Upload CLI smoke payloads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-json-smoke
          path: ci_cli_json

  extras-tests:
    runs-on: ubuntu-latest
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: signature
            extras: signature
          - label: rl
            extras: rl
          - label: all
            extras: 'rl,signature'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install package with extras
        run: |
          python -m pip install --upgrade pip
          pip install .[${{ matrix.extras }}]
      - name: Run targeted tests
        run: |
          if [ "${{ matrix.extras }}" = "signature" ]; then
            pytest tests/test_signature.py tests/test_signature_pipeline.py
          elif [ "${{ matrix.extras }}" = "rl" ]; then
            pytest tests/test_policy_factory.py
          else
            pytest -m 'not kaggle'
          fi

  wheel-e2e:
    runs-on: ubuntu-latest
    needs:
      - build-test
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build
      - name: Install wheel
        run: |
          pip install -U dist/*.whl
      - name: Smoke run (entry point)
        run: |
          python -m leadlag.pipelines.run_full_suite --cfg job
      - name: One-click paper flow
        env:
          RES: .ci/results
          OUT: .ci/paper_outputs
        run: |
          mkdir -p .ci
          rm -rf "$RES" "$OUT"
          RES="$RES" OUT="$OUT" bash scripts/reproduce_all.sh
      - name: Package OpenReview artifact
        id: pack-openreview
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p .ci
          LOG=.ci/openreview_pack.log
          bash scripts/pack_openreview.sh --verify | tee "$LOG"
          SIZE_MB=$(du -m artifact_anonymous.zip | awk '{print $1}')
          echo "size_mb=$SIZE_MB" >> "$GITHUB_OUTPUT"
      - name: Smoke reproduce from packaged artifact
        if: ${{ steps.pack-openreview.outcome == 'success' }}
        env:
          RES: .ci/archive_results
          OUT: .ci/archive_paper_outputs
        run: |
          set -euo pipefail
          rm -rf "$RES" "$OUT" .ci/openreview_unpack
          mkdir -p .ci/openreview_unpack
          unzip -q artifact_anonymous.zip -d .ci/openreview_unpack
          pushd .ci/openreview_unpack/artifact >/dev/null
          pip install -e .
          RES="$RES" OUT="$OUT" bash scripts/reproduce_all.sh --skip-stats --profiles "training=smoke"
          popd >/dev/null
          if [ ! -d "$OUT" ] || [ -z "$(ls -A "$OUT")" ]; then
            echo "paper_outputs missing from smoke reproduction" >&2
            exit 1
          fi
      - name: Upload OpenReview package artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openreview-package-${{ matrix.python-version }}
          path: |
            artifact_anonymous.zip
            .ci/openreview_pack.log
            .ci/archive_paper_outputs
          if-no-files-found: warn
      - name: Enforce packaging success
        if: ${{ steps.pack-openreview.outcome == 'failure' }}
        run: |
          echo "OpenReview packaging failed" >&2
          exit 1
      - name: Validate manifest with CLI
        run: |
          RUNDIR=$(ls -1 .ci/results | head -n1)
          python -m leadlag.utils.print_manifest --root ".ci/results/${RUNDIR}" --format json > .ci/manifest.json
          python - <<'PY'
import json
from pathlib import Path

payload = json.loads(Path('.ci/manifest.json').read_text(encoding='utf-8'))
data = payload.get('data', {})
required = ('feature_time', 'config_sources', 'env_steps_reported', 'env_steps_actual')
missing = [key for key in required if key not in data]
if missing:
    raise SystemExit(f"manifest missing: {missing}")
ft = data['feature_time']
for key in ('min_lag_ns', 'max_lag_ns', 'checked_rows'):
    if ft.get(key) in (None, 0):
        raise SystemExit(f"feature_time missing {key} metadata: {ft}")
PY
      - name: Validate paper artifacts
        run: |
          python - <<'PY'
from pathlib import Path

from leadlag.reporting.paper_outputs import validate_paper_artifact_set

validated = validate_paper_artifact_set(Path('.ci/paper_outputs'))
print(f'validated_artifacts={len(validated)}')
PY
      - name: Flake sentry (artifact stability)
        run: |
          for idx in 1 2; do
            RES_DIR=".ci/flake_results_${idx}"
            OUT_DIR=".ci/flake_outputs_${idx}"
            rm -rf "$RES_DIR" "$OUT_DIR"
            RES="$RES_DIR" OUT="$OUT_DIR" bash scripts/reproduce_all.sh --skip-stats --profiles "training=smoke seed=$((idx * 31))"
          done
          python - <<'PY'
from pathlib import Path

def artifact_listing(root: str) -> list[str]:
    return sorted(
        path.name for path in Path(root).glob('*') if path.is_file()
    )

first = artifact_listing('.ci/flake_outputs_1')
second = artifact_listing('.ci/flake_outputs_2')
if first != second:
    raise SystemExit(f'Artifact drift detected: {first} != {second}')
print('flake_artifacts', first)
PY
      - name: Check stats artifacts
        run: |
          ls -1 .ci/paper_outputs | grep -E '(psr_dsr|hac_sharpe_ci|spa_table|mcs_table|forest|heatmap|pnl)' >/dev/null
      - name: Upload paper outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-outputs-${{ matrix.python-version }}
          path: .ci/paper_outputs
