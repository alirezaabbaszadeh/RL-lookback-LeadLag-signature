name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run scenario smoke test
        run: |
          mkdir -p ci_smoke
          python main.py --results-root ci_smoke --include fixed_30 --max-scenarios 1 --stop-on-error
      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: ci_smoke

  build-test:
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-kaggle.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Verify dependency health
        run: |
          pip check || true
      - name: Lint (ruff)
        run: |
          ruff check .
      - name: Run tests
        run: |
          pytest -q

  build-package:
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build
      - name: Install wheel and run CLI smoke
        run: |
          pip install dist/*.whl
          leadlag --list
          LEADLAG_RESULTS_ROOT=/tmp/leadlag-ci-results leadlag --dry-run --include fixed_30 --max-scenarios 1 --json

  extras-tests:
    runs-on: ubuntu-latest
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        extra: ["signature", "rl"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install package with extras
        run: |
          python -m pip install --upgrade pip
          pip install .[${{ matrix.extra }}]
      - name: Run targeted tests
        run: |
          if [ "${{ matrix.extra }}" = "signature" ]; then
            pytest tests/test_signature.py tests/test_signature_pipeline.py;
          else
            pytest tests/test_policy_factory.py;
          fi
