defaults:
  - agent: ppo
  - features: base
  - data: sp500_sector
  - split: walk_forward_purged
  - training: smoke
  - hardware: gpu
  - reporting: base
  - scenario: fixed_30
  - _self_

results_root: ${oc.env:LEADLAG_RESULTS_ROOT,/kaggle/working/results}
paper_outputs_root: ${oc.env:LEADLAG_PAPER_ROOT,/kaggle/working/paper_outputs}

env:
  action_space: discrete3
  max_abs_position: 1.0
  initial_position: 0.0
  allow_short: true  # Set to false to clamp positions/actions to long-only range

policy:
  name: mlp

window:
  lookback: 128

target:
  horizon: 1

reward:
  name: sharpe

costs:
  fee_bps: 1

slippage:
  bps: 2

logging:
  run_id: ${now:%Y%m%d}-${agent.name}-${training.seeds[0]}
  append_seed_window: true

multi_seed:
  enabled: true
  seeds: ${training.seeds}

metadata:
  version: 3
