extends: ../base.yaml

analysis:
  method: ccf_at_lag
  lookback: 30
  ccf_at_lag:
    lag: 1
    correlation_method: pearson
    quantiles: 4

run:
  run_name: ccf_fixed
  seed: 42

metrics:
  compute:
    - mean_abs_matrix
    - row_sum_std
    - row_sum_range
    - stability_matrix_corr
  plots:
    - signal_strength
    - stability
