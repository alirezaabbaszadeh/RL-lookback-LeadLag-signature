[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "leadlag-signature-rl"
version = "0.1.0"
description = "Lead-lag signature RL experimentation toolkit"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "LeadLag Team" },
]
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.23,<2.0",
    "pandas>=1.5,<2.3",
    "scipy>=1.10,<1.16",
    "scikit-learn>=1.2,<1.7",
    "tqdm>=4.64",
    "matplotlib>=3.6,<3.11",
    "pyyaml>=6.0",
    "hydra-core>=1.3,<2.0",
    "gymnasium>=0.29,<0.30",
]

[project.urls]
Homepage = "https://github.com/username/LeadLag-signature-RL"

[project.optional-dependencies]
rl = [
    "stable-baselines3==2.1.0",
    "sb3-contrib==2.1.0",
    "torch>=2.1,<2.7",
]
signature = [
    "iisignature>=0.24",
    "dcor>=0.6",
    "numba>=0.56,<0.61",
]
kaggle = [
    "kaggle-environments==1.18.0",
]
mlflow = [
    "mlflow>=2.7",
]

[project.scripts]
leadlag = "main:main"
leadlag-full-suite = "pipelines.run_full_suite:main"
leadlag-ablation = "pipelines.run_ablation:main"
leadlag-compare = "reporting.compare_scenarios:main"
leadlag-plot-balance = "reporting.plot_balance_history:main"
leadlag-report = "reporting.generate_report:main"
leadlag-log-trajectories = "research.offline_rl.log_trajectories:main"
leadlag-train-offline = "research.offline_rl.train_offline:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [
    "leadlag*",
]
namespaces = true
where = [
    "src",
]

[tool.setuptools.package-data]
"leadlag.configs" = [
    "**/*.yaml",
]
"leadlag.models.leadlag" = [
    "*.json",
    "*.yaml",
]
