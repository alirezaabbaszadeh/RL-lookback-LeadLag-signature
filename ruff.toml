line-length = 100
target-version = "py310"
exclude = [
  ".git",
  "__pycache__",
  ".venv",
  ".pytest_cache",
  "notebooks",
]

[lint]
select = ["E", "F", "I"]
# Ignore import-at-top (for sys.path hacks in scripts/tests)
ignore = ["E402"]

[lint.per-file-ignores]
"tests/*" = ["E501"]
"scripts/*" = ["E501"]
"kaggle/*" = ["E501"]
