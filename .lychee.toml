# Configuration for lychee link checker used in CI
# https://github.com/lycheeverse/lychee
verbose = true
no_progress = true
accept = ["200..299", "403"]
max_redirects = 5
timeout = "20s"
retry_wait_time = "2s"
retry_count = 2
exclude = [
  "http://localhost*",
  "https://localhost*",
  "http://127.0.0.1*",
  "https://127.0.0.1*",
  "https://kaggle.com*",
  "https://www.kaggle.com*"
]
exclude_path = [
  "tmp_cli_json_run/**",
  "results/**",
  "raw_data/**",
  "reports/**",
  "multi_stage_artifacts.zip"
]

[markdown]
# Skip changelog which may reference links to unreleased assets.
exclude = ["CHANGELOG.md"]
